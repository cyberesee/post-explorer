<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dynamic Post Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Post Explorer</h1>
      <p class="subtitle">Load blog posts dynamically without a page refresh using the standard web JSONPlaceholder API.
</p>
    </header>

    <button id="loadBtn" type="button">Load posts</button>

    <div id="status" role="status" aria-live="polite"></div>

    <button id="retryBtn" type="button" hidden>Try again</button>

    <section id="postList" class="post-list" aria-label="Posts"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
